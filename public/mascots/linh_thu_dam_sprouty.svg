<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="damBodyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stopColor="#86EFAC" />
      <stop offset="60%" stopColor="#22C55E" />
      <stop offset="100%" stopColor="#15803D" />
    </radialGradient>
    <radialGradient id="damLeafGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#BBF7D0" />
      <stop offset="100%" stopColor="#22C55E" />
    </radialGradient>
    <filter id="shadowDam" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#15803D" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Bóng chân -->
  <ellipse cx="100" cy="180" rx="45" ry="10" fill="#15803D" opacity="0.2" />

  <!-- Hai tai lá non trên đầu -->
  <g filter="url(#shadowDam)">
    <path d="M 100 50 C 70 15, 30 28, 48 56 C 60 72, 90 64, 98 56" fill="url(#damLeafGrad)" stroke="#15803D" stroke-width="3" />
    <path d="M 100 50 C 130 15, 170 28, 152 56 C 140 72, 110 64, 102 56" fill="url(#damLeafGrad)" stroke="#15803D" stroke-width="3" />
    <path d="M 100 54 L 100 70" stroke="#15803D" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Thân tròn vo múp míp -->
  <circle cx="100" cy="120" r="58" fill="url(#damBodyGrad)" stroke="#15803D" stroke-width="3.5" filter="url(#shadowDam)" />

  <!-- Kính bảo hộ hóa học tí hon -->
  <g transform="translate(0, -4)">
    <rect x="65" y="78" width="28" height="18" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="3" opacity="0.95" />
    <rect x="107" y="78" width="28" height="18" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="3" opacity="0.95" />
    <line x1="93" y1="87" x2="107" y2="87" stroke="#0284C7" stroke-width="3.5" />
    <line x1="52" y1="87" x2="65" y2="87" stroke="#0284C7" stroke-width="2.5" />
    <line x1="135" y1="87" x2="148" y2="87" stroke="#0284C7" stroke-width="2.5" />
  </g>

  <!-- Má hồng phúng phính -->
  <ellipse cx="72" cy="130" rx="9" ry="6" fill="#FB7185" opacity="0.8" />
  <ellipse cx="128" cy="130" rx="9" ry="6" fill="#FB7185" opacity="0.8" />

  <!-- Đôi mắt to tròn long lanh anime -->
  <ellipse cx="80" cy="115" rx="7.5" ry="9.5" fill="#0F172A" />
  <ellipse cx="120" cy="115" rx="7.5" ry="9.5" fill="#0F172A" />
  <circle cx="77" cy="110" r="3.2" fill="#FFFFFF" />
  <circle cx="117" cy="110" r="3.2" fill="#FFFFFF" />
  <circle cx="82" cy="118" r="1.8" fill="#FFFFFF" />
  <circle cx="122" cy="118" r="1.8" fill="#FFFFFF" />

  <!-- Nụ cười toe toét -->
  <path d="M 90 128 Q 100 144, 110 128 Z" fill="#E11D48" stroke="#0F172A" stroke-width="2" />

  <!-- Hai tay mầm vẫy chào -->
  <path d="M 50 126 Q 34 115, 32 130" fill="none" stroke="#15803D" stroke-width="7" stroke-linecap="round" />
  <path d="M 150 126 Q 166 115, 168 130" fill="none" stroke="#15803D" stroke-width="7" stroke-linecap="round" />
</svg>
