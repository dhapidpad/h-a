<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <radialGradient id="gradSproutTrio" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stopColor="#86EFAC" />
      <stop offset="60%" stopColor="#22C55E" />
      <stop offset="100%" stopColor="#15803D" />
    </radialGradient>
    <radialGradient id="gradSparkyTrio" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stopColor="#DDD6FE" />
      <stop offset="60%" stopColor="#8C6BFA" />
      <stop offset="100%" stopColor="#5B21B6" />
    </radialGradient>
    <radialGradient id="gradSunnyTrio" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="55%" stopColor="#FFB547" />
      <stop offset="100%" stopColor="#D97706" />
    </radialGradient>
  </defs>

  <!-- Nền bục danh dự -->
  <ellipse cx="150" cy="170" rx="120" ry="20" fill="#E2E8F0" />
  <rect x="50" y="150" width="200" height="20" rx="10" fill="#CBD5E1" />
  <text x="150" y="164" text-anchor="middle" font-size="10" font-weight="900" fill="#475569">★ BIỆT ĐỘI NPK — 9 THÀNH VIÊN ★</text>

  <!-- 1. Bé Lân (bên trái) -->
  <g transform="translate(80, 110)">
    <ellipse cx="0" cy="0" rx="34" ry="40" fill="url(#gradSparkyTrio)" stroke="#5B21B6" stroke-width="2.5" />
    <polygon points="-12,-40 -5,-52 0,-44 5,-52 12,-40" fill="#FDE047" stroke="#CA8A04" stroke-width="2" />
    <text x="-16" y="-6" fill="#FDE047" font-size="20" font-weight="bold">★</text>
    <text x="2" y="-6" fill="#FDE047" font-size="20" font-weight="bold">★</text>
    <ellipse cx="-16" cy="10" rx="6" ry="4" fill="#F472B6" />
    <ellipse cx="16" cy="10" rx="6" ry="4" fill="#F472B6" />
  </g>

  <!-- 2. Bé Kali (bên phải) -->
  <g transform="translate(220, 110)">
    <circle cx="0" cy="0" r="36" fill="url(#gradSunnyTrio)" stroke="#B45309" stroke-width="2.5" />
    <circle cx="20" cy="-28" r="6" fill="#FFFFFF" />
    <circle cx="20" cy="-28" r="3" fill="#F59E0B" />
    <circle cx="-12" cy="-4" r="5" fill="#0F172A" />
    <circle cx="12" cy="-4" r="5" fill="#0F172A" />
    <circle cx="-14" cy="-7" r="2" fill="#FFFFFF" />
    <circle cx="10" cy="-7" r="2" fill="#FFFFFF" />
    <ellipse cx="-16" cy="10" rx="6" ry="4" fill="#F87171" />
    <ellipse cx="16" cy="10" rx="6" ry="4" fill="#F87171" />
    <path d="M -5 10 Q 0 18, 5 10" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 3. Bé Đạm (ở giữa - Đội trưởng) -->
  <g transform="translate(150, 115)">
    <circle cx="0" cy="0" r="42" fill="url(#gradSproutTrio)" stroke="#15803D" stroke-width="3" />
    <path d="M 0 -36 C -18 -52, -32 -42, -22 -28 Z" fill="#86EFAC" stroke="#15803D" stroke-width="2" />
    <path d="M 0 -36 C 18 -52, 32 -42, 22 -28 Z" fill="#86EFAC" stroke="#15803D" stroke-width="2" />
    <!-- Mũ đội trưởng -->
    <ellipse cx="0" cy="-32" rx="24" ry="7" fill="#FDE047" stroke="#CA8A04" stroke-width="2" />
    <polygon points="-8,-32 0,-46 8,-32" fill="#EAB308" stroke="#CA8A04" stroke-width="2" />
    <!-- Mắt & Miệng -->
    <circle cx="-12" cy="-4" r="5" fill="#0F172A" />
    <circle cx="12" cy="-4" r="5" fill="#0F172A" />
    <circle cx="-14" cy="-7" r="2" fill="#FFFFFF" />
    <circle cx="10" cy="-7" r="2" fill="#FFFFFF" />
    <ellipse cx="-18" cy="10" rx="7" ry="4.5" fill="#FB7185" />
    <ellipse cx="18" cy="10" rx="7" ry="4.5" fill="#FB7185" />
    <path d="M -6 10 Q 0 20, 6 10 Z" fill="#E11D48" stroke="#0F172A" stroke-width="1.5" />
    <!-- Cờ NPK -->
    <line x1="28" y1="4" x2="48" y2="-24" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
    <polygon points="48,-24 70,-18 48,-10" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5" />
    <text x="56" y="-15" fill="#FFFFFF" font-size="9" font-weight="bold">NPK</text>
  </g>
</svg>
