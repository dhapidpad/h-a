<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="kaliBodyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="55%" stopColor="#FFB547" />
      <stop offset="100%" stopColor="#D97706" />
    </radialGradient>
    <filter id="shadowKali" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#D97706" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Bóng chân -->
  <ellipse cx="100" cy="182" rx="46" ry="10" fill="#B45309" opacity="0.2" />

  <!-- Bông hoa nhỏ xinh cài đầu -->
  <g transform="translate(126, 52)">
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3.5" fill="#F59E0B" />
    <circle cx="-7" cy="-3" r="5" fill="#FEF08A" />
    <circle cx="7" cy="-3" r="5" fill="#FEF08A" />
    <circle cx="0" cy="-8" r="5" fill="#FEF08A" />
  </g>

  <!-- Thân quả tròn vo núng nính -->
  <circle cx="100" cy="120" r="58" fill="url(#kaliBodyGrad)" stroke="#B45309" stroke-width="3.5" filter="url(#shadowKali)" />

  <!-- Má đào phúng phính -->
  <ellipse cx="70" cy="130" rx="10" ry="6" fill="#F87171" opacity="0.85" />
  <ellipse cx="130" cy="130" rx="10" ry="6" fill="#F87171" opacity="0.85" />

  <!-- Đôi mắt to tròn long lanh anime -->
  <ellipse cx="80" cy="115" rx="8" ry="10" fill="#0F172A" />
  <ellipse cx="120" cy="115" rx="8" ry="10" fill="#0F172A" />
  <circle cx="77" cy="110" r="3.5" fill="#FFFFFF" />
  <circle cx="117" cy="110" r="3.5" fill="#FFFFFF" />
  <circle cx="83" cy="118" r="2" fill="#FFFFFF" />
  <circle cx="123" cy="118" r="2" fill="#FFFFFF" />

  <!-- Nụ cười vui sướng -->
  <path d="M 92 128 Q 100 144, 108 128 Z" fill="#E11D48" stroke="#0F172A" stroke-width="2" />

  <!-- Khiên lá mini hình chữ K bên hông (Hiệp sĩ đề kháng) -->
  <g transform="translate(30, 114)">
    <path d="M 14 0 C 28 0, 28 20, 14 34 C 0 20, 0 0, 14 0 Z" fill="#22C55E" stroke="#15803D" stroke-width="2.5" />
    <text x="8.5" y="20" font-size="12" font-weight="900" fill="#FFFFFF" font-family="Space Grotesk">K</text>
  </g>
</svg>
