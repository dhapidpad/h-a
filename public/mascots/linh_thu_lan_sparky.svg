<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="lanBodyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stopColor="#DDD6FE" />
      <stop offset="60%" stopColor="#8C6BFA" />
      <stop offset="100%" stopColor="#5B21B6" />
    </radialGradient>
    <filter id="shadowLan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#5B21B6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Bóng chân -->
  <ellipse cx="100" cy="188" rx="42" ry="8" fill="#5B21B6" opacity="0.2" />

  <!-- Chùm rễ nhỏ bên dưới cắm vào đất -->
  <g stroke="#5B21B6" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 85 174 Q 78 186, 70 190" />
    <path d="M 100 176 L 100 194" />
    <path d="M 115 174 Q 122 186, 130 190" />
  </g>

  <!-- Thân củ rễ tím phát quang -->
  <path d="M 100 60 C 148 60, 160 115, 148 152 C 136 176, 118 178, 100 178 C 82 178, 64 176, 52 152 C 40 115, 52 60, 100 60 Z" 
    fill="url(#lanBodyGrad)" stroke="#5B21B6" stroke-width="3.5" filter="url(#shadowLan)" />

  <!-- Vương miện ngọc photphat lấp lánh trên đầu -->
  <g transform="translate(0, 12)">
    <polygon points="78,46 88,26 100,42 112,26 122,46" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5" />
    <circle cx="100" cy="34" r="4.5" fill="#8C6BFA" />
    <circle cx="88" cy="28" r="2" fill="#FFFFFF" />
    <circle cx="112" cy="28" r="2" fill="#FFFFFF" />
  </g>

  <!-- Má hồng tím xinh xắn -->
  <ellipse cx="72" cy="128" rx="10" ry="6" fill="#F472B6" opacity="0.85" />
  <ellipse cx="128" cy="128" rx="10" ry="6" fill="#F472B6" opacity="0.85" />

  <!-- Đôi mắt hình ngôi sao vàng rực sáng năng lượng -->
  <g fill="#FDE047">
    <text x="66" y="118" font-size="28" font-weight="bold">★</text>
    <text x="116" y="118" font-size="28" font-weight="bold">★</text>
  </g>

  <!-- Nụ cười mỉm nhỏ dễ thương -->
  <path d="M 92 128 Q 100 138, 108 128" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />

  <!-- Cục pin sinh học ATP ôm trước ngực -->
  <g transform="translate(82, 140)">
    <rect x="0" y="0" width="32" height="18" rx="4" fill="#FDE047" stroke="#0F172A" stroke-width="2.2" />
    <rect x="32" y="4" width="4" height="10" rx="1.5" fill="#0F172A" />
    <path d="M 18 2 L 11 10 L 17 10 L 14 16 L 22 8 L 16 8 Z" fill="#EA580C" />
  </g>
</svg>
